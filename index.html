<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VocabMaster Game Edition</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --secondary: #f472b6;
            --accent: #22d3ee;
            --background: #070b14;
            --card-bg: rgba(30, 41, 59, 0.5);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--background);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(244, 114, 182, 0.1) 0%, transparent 40%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 20px);
        }

        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
        }

        .view.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.98);
            }
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(124, 58, 237, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0);
            }
        }

        .header {
            padding: 10px;
            text-align: center;
        }

        .xp-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .xp-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s;
            width: 0%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 10px 0;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-val {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(7, 11, 20, 0.9));
            border-radius: 30px;
            padding: 30px 15px;
            text-align: center;
            margin: 15px 0;
            border: 2px solid rgba(255, 255, 255, 0.05);
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom, 20px));
            /* MARGE ACCRUE ICI */
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9999;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            gap: 5px;
            flex: 1;
        }

        .tab-item.active {
            color: var(--primary-light);
            font-weight: bold;
        }

        .tab-icon {
            font-size: 24px;
        }

        .word-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        .sentence-box {
            font-size: 16px;
            line-height: 1.5;
            color: #fff;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* STUDY VIEW STYLES */
        .study-grid {
            display: grid;
            gap: 15px;
            margin-top: 10px;
        }

        .study-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s;
        }

        .study-card:active {
            transform: scale(0.98);
        }

        .study-en {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
        }

        .study-fr {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- DASHBOARD -->
        <div id="view-dashboard" class="view active">
            <div class="header">
                <img src="logo.png"
                    style="width: 120px; height: 120px; margin-bottom: 10px; animation: fadeIn 1s ease-out; filter: drop-shadow(0 0 15px rgba(124, 58, 237, 0.5));">
                <h2 id="user-level"
                    style="font-size:1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">Niveau 1
                </h2>
                <div class="xp-bar">
                    <div id="xp-progress" class="xp-progress"></div>
                </div>
                <p style="margin-top:10px; font-size:12px; font-weight: 700; color: var(--text-muted);"><span
                        id="user-xp">0</span> / 100 XP</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="stat-streak" class="stat-val">🔥 0</div>
                    <div style="font-size:10px; color:var(--text-muted)">SERIE</div>
                </div>
                <div class="stat-card">
                    <div id="stat-due" class="stat-val">0</div>
                    <div style="font-size:10px; color:var(--text-muted)">A REVISER</div>
                </div>
            </div>
            <button class="btn" style="background: linear-gradient(135deg, #6366f1, #ec4899); height: 80px;"
                onclick="startSession()">RÉVISER</button>
        </div>

        <!-- REVIEW -->
        <div id="view-review" class="view">
            <div
                style="display:flex; justify-content:space-between; align-items:center; position: sticky; top: 0; background: var(--background); z-index: 10; padding-bottom: 10px;">
                <span id="review-progress" style="font-size:12px; color:var(--text-muted)">0/0</span>
                <span id="mode-badge"
                    style="background:var(--primary); padding:3px 10px; border-radius:15px; font-size:10px;">EXERCICE</span>
                <span onclick="switchView('dashboard')"
                    style="color:var(--text-muted); cursor: pointer; padding: 5px;">Quitter</span>
            </div>
            <div class="card" id="main-card">
                <div id="card-question"
                    style="font-size: 12px; font-weight: 700; text-transform: uppercase; color:var(--accent); margin-bottom:15px; letter-spacing: 1px;">
                    ...</div>
                <div id="card-main-text" style="font-size: 32px; font-weight: 900; color: #fff;">...</div>

                <!-- HINT ZONE -->
                <div id="hint-zone" style="margin-top: 15px;">
                    <button class="hint-btn" id="btn-hint" onclick="getAIHint()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-muted); padding: 8px 15px; border-radius: 12px; font-size: 12px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
                        <span>💡</span> INDICE IA
                    </button>
                    <div id="hint-display" style="font-size: 13px; color: var(--accent); margin-top: 10px; font-style: italic; display:none; animation: fadeIn 0.3s;"></div>
                </div>
            </div>
            <div id="flash-actions"><button class="btn" onclick="revealCard()">RÉPONSE</button></div>
            <div id="score-actions" style="display:none; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <button class="btn" style="background:#475569" onclick="submitScore(1)">Revoir</button>
                <button class="btn" style="background:#ea580c" onclick="submitScore(3)">Dur</button>
                <button class="btn" style="background:#2563eb" onclick="submitScore(4)">Bien</button>
                <button class="btn" style="background:#16a34a" onclick="submitScore(5)">Facile</button>
            </div>
        </div>

        <!-- STUDY (REVISION) -->
        <div id="view-study" class="view">
            <h1 style="font-size:1.5rem; margin-bottom:15px;">Révision</h1>
            <div id="study-list" class="study-grid"></div>
        </div>

        <!-- LIST -->
        <div id="view-list" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h1 style="font-size:1.5rem">Mots</h1>
                <button class="btn" style="width:auto; padding:8px 15px; margin:0;"
                    onclick="showEditForm(null, '', '')">+ AJOUTER</button>
            </div>
            <div id="word-list"></div>
        </div>

        <!-- EDIT -->
        <div id="view-edit" class="view">
            <h2 id="edit-title">Éditer</h2>
            <div style="margin-top:15px;">
                <input type="hidden" id="edit-id">
                <input type="text" id="edit-fr" placeholder="Français">
                <input type="text" id="edit-en" placeholder="Anglais">
                <button class="btn" onclick="saveWord()">SAUVER</button>
                <button id="del-btn" class="btn" style="background:#ef4444" onclick="deleteWord()">SUPPRIMER</button>
                <button class="btn" style="background:transparent; border:1px solid rgba(255,255,255,0.1)"
                    onclick="switchView('list')">RETOUR</button>
            </div>
        </div>

        <!-- TAB BAR -->
        <nav class="tab-bar">
            <div class="tab-item active" id="tab-dashboard" onclick="switchView('dashboard')">
                <span class="tab-icon">🏠</span><span>Accueil</span>
            </div>
            <div class="tab-item" id="tab-study" onclick="switchView('study')">
                <span class="tab-icon">📖</span><span>Révision</span>
            </div>
            <div class="tab-item" id="tab-list" onclick="switchView('list')">
                <span class="tab-icon">⚙️</span><span>Gérer</span>
            </div>
        </nav>
    </div>

    <script>
        let db, session = [], currentIndex = 0;
        let userData = { xp: 0, streak: 0, lastVisit: null };

        // Chargement sécurisé des données utilisateur
        try {
            const saved = localStorage.getItem('vocabUser');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed && typeof parsed.xp === 'number') {
                    userData = parsed;
                }
            }
        } catch (e) {
            console.error("Erreur lecture localStorage:", e);
        }

        let hintUsed = false;

        const initialVocab = [

            { en: "Prompted", fr: "Provoqué / suscité par" },
            { en: "To keep track of", fr: "Suivre l'évolution de (un dossier, un budget)" },

            { en: "Therefore", fr: "Par conséquent (Indique un résultat)" },
            { en: "Moreover / Furthermore", fr: "De plus / En outre" },
            { en: "Despite / In spite of", fr: "Malgré (Attention : suivi d'un nom ou -ING)" },
            { en: "Although / Even though", fr: "Bien que (Suivi d'un sujet + verbe)" },
            { en: "Unless", fr: "À moins que" },
            { en: "Provided that", fr: "À condition que" },
            { en: "Instead of", fr: "Au lieu de" },
            { en: "Otherwise", fr: "Sinon / faute de quoi" },
            { en: "In order to", fr: "Afin de / pour" },
            { en: "As long as", fr: "Tant que / du moment que" },
            { en: "Whereas", fr: "Tandis que (Pour contraster deux idées)" },
            { en: "Due to / Owing to", fr: "En raison de / à cause de" },
            { en: "Consequently", fr: "Par conséquent" },
            { en: "In addition to", fr: "En plus de" },
            { en: "Nevertheless", fr: "Néanmoins" },
            { en: "Regarding / Concerning", fr: "Concernant / à propos de" },
            { en: "On behalf of", fr: "Au nom de / de la part de" },
            { en: "Such as", fr: "Tel que / comme" },
            { en: "Yet", fr: "Pourtant / cependant" }
        ];

        const req = indexedDB.open("VocabMasterUltimate", 1);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains("words")) {
                d.createObjectStore("words", { keyPath: "id", autoIncrement: true });
            }
        };
        req.onsuccess = (e) => { 
            db = e.target.result; 
            seed(); 
        };
        req.onerror = (e) => console.error("IndexedDB error:", e);

        function seed() {
            if (!db) return;
            const tx = db.transaction("words", "readwrite");
            const store = tx.objectStore("words");
            store.getAll().onsuccess = (ev) => {
                const existing = ev.target.result;
                const existingEn = new Set(existing.map(w => w.en.toLowerCase()));
                
                initialVocab.forEach(v => {
                    if (!existingEn.has(v.en.toLowerCase())) {
                        store.add({ 
                            ...v, 
                            repetition: 0, 
                            interval: 0, 
                            efactor: 2.5, 
                            direction: 'FR_EN', 
                            nextReview: Date.now() 
                        });
                    }
                });
            };
            tx.oncomplete = () => updateDashboard();
        }

        function switchView(v) {
            try {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                const targetView = document.getElementById('view-' + v);
                if (targetView) targetView.classList.add('active');

                const tabBar = document.querySelector('.tab-bar');
                if (tabBar) {
                    tabBar.style.display = (v === 'review') ? 'none' : 'flex';
                }

                document.querySelectorAll('.tab-item').forEach(it => it.classList.remove('active'));
                const tab = document.getElementById('tab-' + v);
                if (tab) tab.classList.add('active');
                
                if (v === 'list') renderList();
                if (v === 'study') renderStudyList();
                if (v === 'dashboard') updateDashboard();
            } catch (e) {
                console.error("switchView error:", e);
            }
        }

        async function updateDashboard() {
            if (!db) return;
            try {
                const level = Math.floor(userData.xp / 100) + 1;
                let rank = "Novice";
                if (level > 40) rank = "Légende";
                else if (level > 30) rank = "Maître";
                else if (level > 20) rank = "Expert";
                else if (level > 10) rank = "Initié";
                else if (level > 5) rank = "Apprenti";

                const lvlEl = document.getElementById('user-level');
                if (lvlEl) lvlEl.innerText = rank + " - Niveau " + level;
                
                const progEl = document.getElementById('xp-progress');
                if (progEl) progEl.style.width = (userData.xp % 100) + "%";
                
                const xpEl = document.getElementById('user-xp');
                if (xpEl) xpEl.innerText = (userData.xp % 100);
                
                const streakEl = document.getElementById('stat-streak');
                if (streakEl) streakEl.innerText = "🔥 " + (userData.streak || 0);

                const all = await new Promise((resolve, reject) => {
                    const tx = db.transaction("words", "readonly");
                    const req = tx.objectStore("words").getAll();
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e);
                });

                const dueEl = document.getElementById('stat-due');
                if (dueEl) dueEl.innerText = all.filter(w => w.nextReview <= Date.now()).length;
            } catch (e) {
                console.error("updateDashboard error:", e);
            }
        }

        function renderStudyList() {
            if (!db) return;
            db.transaction("words").objectStore("words").getAll().onsuccess = (e) => {
                const listEl = document.getElementById('study-list');
                if (!listEl) return;
                listEl.innerHTML = e.target.result.map(w => `
                <div class="study-card">
                    <div class="study-en">${w.en}</div>
                    <div class="study-fr">${w.fr}</div>
                </div>`).join('');
            };
        }

        function renderList() {
            if (!db) return;
            db.transaction("words").objectStore("words").getAll().onsuccess = (e) => {
                const listEl = document.getElementById('word-list');
                if (!listEl) return;
                listEl.innerHTML = e.target.result.map(w => `
                <div class="word-item" onclick="showEditForm(${w.id}, '${w.fr.replace(/'/g, "\\'")}', '${w.en.replace(/'/g, "\\'")}')">
                    <b>${w.fr}</b> <span>➔ ${w.en}</span>
                </div>`).join('');
            };
        }

        function showEditForm(id, fr, en) {
            document.getElementById('edit-id').value = id || '';
            document.getElementById('edit-fr').value = fr;
            document.getElementById('edit-en').value = en;
            document.getElementById('del-btn').style.display = id ? 'block' : 'none';
            switchView('edit');
        }

        function saveWord() {
            const id = document.getElementById('edit-id').value, 
                  fr = document.getElementById('edit-fr').value.trim(), 
                  en = document.getElementById('edit-en').value.trim();
            if (!fr || !en) return;
            const store = db.transaction("words", "readwrite").objectStore("words");
            if (id) {
                store.get(Number(id)).onsuccess = (e) => {
                    const data = e.target.result;
                    data.fr = fr;
                    data.en = en;
                    store.put(data);
                };
            } else {
                store.add({ fr, en, repetition: 0, interval: 0, efactor: 2.5, direction: 'FR_EN', nextReview: Date.now() });
            }
            setTimeout(() => switchView('list'), 100);
        }

        function deleteWord() {
            if (confirm("Supprimer ?")) {
                db.transaction("words", "readwrite").objectStore("words").delete(Number(document.getElementById('edit-id').value)).onsuccess = () => switchView('list');
            }
        }

        async function startSession() {
            if (!db) return;
            const words = await new Promise(r => db.transaction("words").objectStore("words").getAll().onsuccess = (e) => r(e.target.result));
            let due = words.filter(w => w.nextReview <= Date.now()).sort(() => Math.random() - 0.5);
            if (due.length < 20) {
                const other = words.filter(w => w.nextReview > Date.now()).sort(() => Math.random() - 0.5);
                due = [...due, ...other];
            }
            if (due.length === 0) return alert("Ajoutez des mots d'abord !");
            session = due.slice(0, 20);
            currentIndex = 0;
            showCard();
            switchView('review');
        }

        function showCard() {
            const w = session[currentIndex];
            if (!w) return;
            hintUsed = false;

            const progEl = document.getElementById('review-progress');
            if (progEl) progEl.innerText = (currentIndex + 1) + "/" + session.length;
            
            const badgeEl = document.getElementById('mode-badge');
            if (badgeEl) {
                badgeEl.innerText = '🧠 MÉMORISATION';
                badgeEl.style.background = 'var(--primary)';
            }

            const qEl = document.getElementById('card-question');
            if (qEl) qEl.innerText = w.direction === 'FR_EN' ? "Traduction Anglaise ?" : "Traduction Française ?";
            
            const txtEl = document.getElementById('card-main-text');
            if (txtEl) txtEl.innerText = w.direction === 'FR_EN' ? w.fr : w.en;

            document.getElementById('flash-actions').style.display = 'block';
            document.getElementById('score-actions').style.display = 'none';
            document.getElementById('hint-display').style.display = 'none';
            document.getElementById('btn-hint').style.display = 'flex';
        }

        async function getAIHint(isAuto = false) {
            if (!isAuto) hintUsed = true;
            const w = session[currentIndex];
            const target = w.direction === 'FR_EN' ? w.en : w.fr;
            const display = document.getElementById('hint-display');
            if (!display) return;

            display.innerText = "Récupération de l'indice...";
            display.style.display = 'block';
            if (!isAuto) {
                const btnHint = document.getElementById('btn-hint');
                if (btnHint) btnHint.style.display = 'none';
            }

            try {
                const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(target.toLowerCase())}`);
                const data = await resp.json();
                const hint = (data && data[0]?.meanings[0]?.definitions[0]?.definition) || "Pas d'indice disponible.";
                display.innerText = "Indice : " + hint;
            } catch (e) {
                display.innerText = "Indice : Commence par '" + target[0] + "' et finit par '" + target[target.length - 1] + "'";
            }
        }

        function revealCard() {
            const w = session[currentIndex];
            if (!w) return;
            const txtEl = document.getElementById('card-main-text');
            if (txtEl) txtEl.innerText = w.direction === 'FR_EN' ? w.en : w.fr;
            document.getElementById('flash-actions').style.display = 'none';
            document.getElementById('score-actions').style.display = 'grid';
        }

        async function submitScore(q) {
            const w = session[currentIndex];
            if (!w) return;
            let { repetition: r, interval: i, efactor: f } = w;

            if (q === 4) userData.xp += 5;
            if (q === 5) userData.xp += 10;

            if (hintUsed) q = 1;

            if (q < 3) { r = 0; i = 1; } else {
                if (r === 0) i = 1; else if (r === 1) i = 6; else i = Math.round(i * f);
                r++;
            }
            f = Math.max(1.3, f + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
            const up = { ...w, repetition: r, interval: i, efactor: f, direction: r % 2 === 0 ? 'EN_FR' : 'FR_EN', nextReview: Date.now() + i * 86400000 };

            const tx = db.transaction("words", "readwrite");
            tx.objectStore("words").put(up);
            tx.oncomplete = () => {
                localStorage.setItem('vocabUser', JSON.stringify(userData));
                currentIndex++;
                if (currentIndex < session.length) {
                    showCard();
                } else {
                    alert("Session terminée ! Bravo.");
                    switchView('dashboard');
                }
            };
        }

        window.onload = () => {
            setTimeout(() => switchView('dashboard'), 100);
        };
    </script>
</body>

</html>
